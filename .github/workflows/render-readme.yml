name: Render README

on:
  push:
    paths:
      - "profile.config.json"
      - "README.template.md"
      - "scripts/render_readme.py"
      - ".github/workflows/render-readme.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Render README
        run: python scripts/render_readme.py

      - name: Commit README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "README.md 没有变化"
          else
            git commit -m "chore: render README from template"
            git push
          fi